name: JUCE DSP Tests

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label
        required: false
        type: string
        default: ubuntu-latest
      source-directory:
        description: CMake source directory
        required: false
        type: string
        default: .
      build-directory:
        description: CMake build directory
        required: false
        type: string
        default: build/ci
      build-type:
        description: CMake build type
        required: false
        type: string
        default: Release
      cmake-configure-args:
        description: Extra CMake configure arguments
        required: false
        type: string
        default: ""
      build-targets:
        description: Optional space-separated build targets
        required: false
        type: string
        default: ""
      run-tests:
        description: Whether to run ctest
        required: false
        type: boolean
        default: true
      cache-prefix:
        description: Cache namespace
        required: false
        type: string
        default: juce
      default-branch:
        description: Branch allowed to publish caches
        required: false
        type: string
        default: main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.source-directory }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/${{ inputs.cache-prefix }}/ccache
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.cache/${{ inputs.cache-prefix }}/fetchcontent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare caches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR" "$FETCHCONTENT_BASE_DIR"

      - name: Install ccache and Ninja
        shell: bash
        run: |
          set -euo pipefail
          if command -v ccache >/dev/null 2>&1 && command -v ninja >/dev/null 2>&1; then
            exit 0
          fi
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y ccache ninja-build
              ;;
            macOS)
              brew update
              brew install ccache ninja
              ;;
            *)
              echo "Unsupported runner for this workflow: $RUNNER_OS" >&2
              exit 1
              ;;
          esac

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ inputs.cache-prefix }}-ccache-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', '**/*.cpp', '**/*.c', '**/*.h', '**/*.hpp') }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.cache-prefix }}-ccache-

      - name: Restore FetchContent cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          key: ${{ runner.os }}-${{ inputs.cache-prefix }}-fetchcontent-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.cache-prefix }}-fetchcontent-

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B "${{ inputs.build-directory }}" -G Ninja \
            -DCMAKE_BUILD_TYPE="${{ inputs.build-type }}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DFETCHCONTENT_BASE_DIR="$FETCHCONTENT_BASE_DIR" \
            ${{ inputs.cmake-configure-args }}

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.build-targets }}" ]]; then
            read -r -a targets <<< "${{ inputs.build-targets }}"
            cmake --build "${{ inputs.build-directory }}" --parallel --target "${targets[@]}"
          else
            cmake --build "${{ inputs.build-directory }}" --parallel
          fi

      - name: Test
        if: ${{ inputs.run-tests }}
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir "${{ inputs.build-directory }}" --output-on-failure

      - name: Save compiler cache
        if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', inputs.default-branch) }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ inputs.cache-prefix }}-ccache-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', '**/*.cpp', '**/*.c', '**/*.h', '**/*.hpp') }}

      - name: Save FetchContent cache
        if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', inputs.default-branch) }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          key: ${{ runner.os }}-${{ inputs.cache-prefix }}-fetchcontent-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
